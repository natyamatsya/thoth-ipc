#
# Cross-language demo matrix for tools/xlang-runner's `demo-runner`.
#
# Every demo exists in several ports with one CLI, and because the wire format
# is byte-exact their roles mix across languages. For each demo the runner
# assigns every present language to every `slot` (the Cartesian product) and
# starts `each_language` processes once per present language, then checks exit
# codes and stdout. Placeholders are documented in src/demo/config.rs.
#
# Language dirs are environment variables, as in xlang-ci.toml: a language whose
# variable is unset (Swift on Linux) is absent on that host. Use --require in CI
# so a demo binary that failed to build cannot be skipped silently.

[run]
jobs = 4
retries = 0
case_timeout_secs = 60
ready_timeout_secs = 10
start_gap_ms = 300
failure_grace_ms = 2000

[languages.cpp]
dir = "${DEMO_CPP_DIR}"      # cpp/thoth-ipc/build/bin (-DTHOTH_IPC_BUILD_DEMOS=ON)

[languages.rust]
dir = "${DEMO_RUST_DIR}"     # rust/thoth-ipc/target/release

[languages.swift]
dir = "${DEMO_SWIFT_DIR}"    # swift build -c release --show-bin-path (macOS)

[languages.zig]
dir = "${DEMO_ZIG_DIR}"      # zig/thoth-ipc/zig-out/bin

# --- pipeline: source -> stage -> stage -> sink over thoth::route hops -------
# One process (and language) per hop; the sink prints each item with the tag of
# every language it crossed, so the line proves the whole chain.
[demos.pipeline]
description = "polyglot thoth::route chain, one process per hop"
bins.main = { cpp = "pipeline", rust = "demo_pipeline", swift = "demo-pipeline", zig = "demo_pipeline" }
count = 3

[[demos.pipeline.procs]]
role = "sink"
slot = "sink"
args = ["sink", "{ch:C}", "{count}", "{lang}"]
ready = '^\[sink .*\] ready on'
expect = [
  { line = '^item-\d+ \[{lang:source}\] -> {lang:stage1} -> {lang:stage2} -> \[{lang:sink} sink\]$', count = "{count}" },
]

[[demos.pipeline.procs]]
role = "stage2"
slot = "stage2"
args = ["stage", "{ch:B}", "{ch:C}", "{count}", "{lang}"]

[[demos.pipeline.procs]]
role = "stage1"
slot = "stage1"
args = ["stage", "{ch:A}", "{ch:B}", "{count}", "{lang}"]

[[demos.pipeline.procs]]
role = "source"
slot = "source"
args = ["source", "{ch:A}", "{count}", "{lang}"]

# --- bounded_buffer: shm ring + named mutex + two counting semaphores --------
# One consumer, one producer per language, all through a 4-slot ring, so the
# semaphores block and every language contends on the mutex. Fixed IPC names.
[demos.bounded_buffer]
description = "producer/consumer ring over a named mutex and two semaphores"
bins.main = { cpp = "bounded_buffer", rust = "demo_bounded_buffer", swift = "demo-bounded-buffer", zig = "demo_bounded_buffer" }
serial = true
clear = ["clear"]
count = 3

[[demos.bounded_buffer.procs]]
role = "consumer"
slot = "consumer"
args = ["consume", "{total}"]
ready = '^\[consumer\] ready'
expect = [
  { line = '^\[consumer\]\s+\d+/{total}\s+\S+ #\d+$', count = "{total}" },
  { line = '^\s+{each}\s+{count}$', for_each_language = true, count = "1" },
]

[[demos.bounded_buffer.procs]]
role = "producer"
each_language = true
args = ["produce", "{lang}", "{count}"]

# --- channel_aggregator: multi-writer thoth::channel fan-in ------------------
# One collector, one producer per language writing concurrently into one
# channel (what a single-writer route cannot do). Fixed channel name.
[demos.channel_aggregator]
description = "multi-writer thoth::channel fan-in into one collector"
bins.main = { cpp = "channel_aggregator", rust = "demo_channel_aggregator", swift = "demo-channel-aggregator", zig = "demo_channel_aggregator" }
serial = true
clear = ["clear"]
count = 5

[[demos.channel_aggregator.procs]]
role = "collector"
slot = "collector"
args = ["collect", "{total}"]
ready = '^\[collector\] ready on'
expect = [
  { line = '^\[collector\]\s+\d+/{total}\s+\S+ #\d+$', count = "{total}" },
  { line = '^\s+{each}\s+{count}$', for_each_language = true, count = "1" },
]

[[demos.channel_aggregator.procs]]
role = "producer"
each_language = true
args = ["produce", "{lang}", "{count}"]
expect = [
  { line = '^\[producer {lang}\] sent {count} messages', count = "1" },
]

# --- secure_pos: AEAD-sealed broadcast bus (C++, Rust, Zig) ------------------
# A pinpad seals card events onto a broadcast route; the gateway (key holder)
# must open every one, the POS (no key) must fail to open every one. The 70 B
# envelope size checks the SIPC framing byte-for-byte across languages.
[demos.secure_pos]
description = "AEAD envelopes on a broadcast route: one key holder, one fail-closed reader"
bins.main = { cpp = "secure_pos", rust = "demo_secure_pos", zig = "demo_secure_pos" }
serial = true
clear = ["clear"]
count = 2

[[demos.secure_pos.procs]]
role = "gateway"
slot = "gateway"
args = ["gateway", "{count}"]
ready = '^\[gateway\] subscribed'
expect = [
  { line = '^\[gateway\] authorised \*\*\*\*-\*\*\*\*-\*\*\*\*-1111 for \d+c \(event #\d+\)$', count = "{count}" },
]

[[demos.secure_pos.procs]]
role = "pos"
slot = "pos"
args = ["pos", "{count}"]
ready = '^\[pos\] subscribed'
expect = [
  { line = '^\[pos\] event #\d+: sealed envelope observed', count = "{count}" },
]

[[demos.secure_pos.procs]]
role = "pinpad"
slot = "pinpad"
args = ["pinpad", "{count}"]
expect = [
  { line = '^\[pinpad\] captured .* -> sealed event #\d+ \(70B on the bus\)$', count = "{count}" },
]

# --- audio_service: FlatBuffers control channel + service_group failover -----
# The host spawns two replicas of the service binary it is given, drives them
# over FlatBuffers control/reply channels, kills the primary, promotes the
# standby, respawns, and resumes. Host language x service language.
[demos.audio_service]
description = "service_group failover with a FlatBuffers control protocol"
bins.main = { cpp = "audio_host", rust = "demo_audio_host" }
bins.service = { cpp = "audio_service", rust = "demo_audio_service" }
serial = true
count = 1

[[demos.audio_service.procs]]
role = "host"
slot = "host"
args = ["{path:service@service}"]
expect = [
  { line = '^host:\s+ack ref_seq=\d+ status=0$', count = "3" },
  { line = '^host:\s+param 0 = 1\.000000$', count = "1" },
  { line = '^host: 2 instances alive after respawn$', count = "1" },
  { line = '^host: done$', count = "1" },
]

# A slot with no process of its own: the host above runs its binary.
[[demos.audio_service.procs]]
role = "service"
slot = "service"
bin = "service"
args = []
spawned_by = "host"

# --- audio_realtime: shm_ring audio + shared_state heartbeat, warm standby ---
# The host consumes audio blocks from the primary's lock-free ring, watches its
# heartbeat in shared state, fails over to the warm standby and consumes again.
# The heartbeat is a steady_clock timestamp both languages write and read.
[demos.audio_realtime]
description = "lock-free shm_ring audio with a shared-state heartbeat and warm standby"
bins.main = { cpp = "rt_audio_host", rust = "demo_rt_audio_host" }
bins.service = { cpp = "rt_audio_service", rust = "demo_rt_audio_service" }
serial = true
count = 1

[[demos.audio_realtime.procs]]
role = "host"
slot = "host"
args = ["{path:service@service}"]
expect = [
  { line = '^host: consumed [1-9]\d* blocks$', count = "1" },
  { line = '^host: heartbeat age = \d ms \(should be <10\)$', count = "1" },
  { line = '^host: replicated state to new standby ', count = "1" },
  { line = '^host: consumed [1-9]\d* blocks from new primary$', count = "1" },
  { line = '^host: done$', count = "1" },
]

[[demos.audio_realtime.procs]]
role = "service"
slot = "service"
bin = "service"
args = []
spawned_by = "host"
