[package]
name = "xlang-runner"
version = "0.1.0"
edition = "2024"
description = "Cross-language IPC ABI test framework: plans and runs writer x reader matrices over the per-language harness binaries"
license = "MIT"
publish = false
# `cargo run` without --bin runs the ABI matrix, as before demo-runner existed.
default-run = "xlang-runner"

[dependencies]
clap = { version = "4", features = ["derive"] }
regex = "1.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

[[bin]]
name = "xlang-runner"
path = "src/main.rs"

[[bin]]
name = "demo-runner"
path = "src/bin/demo-runner.rs"
